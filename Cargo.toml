[package]
name        = "wrk_graphs"
version     = "0.1.0"
edition     = "2021"
description = "A web application for visualizing and sharing load testing results."
readme      = "README.md"
repository  = "https://github.com/butlerx/wrk-graphs"
license     = "Apache-2.0"
authors     = ["Cian Butler <butlerx@notthe.cloud>"]
keywords    = ["loadtest", "rust", "wasm", "web", "wrk", "yew"]
categories  = ["graphs", "loadtest", "wasm", "web"]

[dependencies]
base64               = "0.23"
brotli               = "9.1"
flate2               = "1"
gloo                 = "0.13"
gloo-file            = "0.4"
itertools            = "0.15"
js-sys               = "0.3"
log                  = "0.4"
rmp-serde            = "1.3"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
thiserror            = "2"
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
wasm-logger          = "0.2"
web-sys              = { version = "0.3", features = ["CanvasRenderingContext2d", "Clipboard", "Document", "Event", "File", "FileList", "HtmlCanvasElement", "HtmlDocument", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Navigator", "Window"] }
yew                  = { version = "0.23", features = ["csr"] }
yew-router           = "0.20"

[lints.clippy]
all         = { level = "warn", priority = -1 }
# Stricter than the shared config: no panics via unwrap or expect.
expect_used = "deny"
pedantic    = { level = "warn", priority = -1 }
unwrap_used = "deny"

[lints.rust]
unsafe_code = "deny"
